<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendaftaran Akun - Islamic Education Management</title>
  <link rel="shortcut icon" href="/img/1.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // AUTO-REDIRECT IF ALREADY LOGGED IN
    if (localStorage.getItem("loggedIn")) {
      const role = localStorage.getItem("userRole");
      if (role === "admin") {
        window.location.replace("admin.html");
      } else if (role === "mentor") {
        window.location.replace("mentor.html");
      } else {
        window.location.replace("index.html");
      }
    }
  </script>
  <style>
    body {
      background-image: url("img/bg.jpg");
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      padding: 2.5rem 0;
    }

    .register-container {
      background: rgba(255, 255, 255, 0.96);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      max-width: 550px;
      width: 90%;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: fadeIn 0.5s ease-out forwards;
    }

    .register-container h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #d604c8;
      font-weight: 800;
    }

    .subtitle-text {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    /* Segmented Tab Control Style */
    .role-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 0.4rem;
      border-radius: 12px;
      margin-bottom: 1.8rem;
      border: 1px solid #e2e8f0;
    }

    .role-tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.65rem 0.5rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .role-tab-btn i {
      font-size: 0.95rem;
    }

    .role-tab-btn:hover {
      color: #0f172a;
    }

    .role-tab-btn.active {
      background: linear-gradient(135deg, #d604c8, #9b05a8);
      color: white;
      box-shadow: 0 4px 10px rgba(214, 4, 200, 0.25);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      font-weight: 600;
      color: #334155;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      display: block;
    }

    .form-control {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      background: #fff;
    }

    .form-control:focus {
      border-color: #d604c8;
      box-shadow: 0 0 0 4px rgba(214, 4, 200, 0.12);
      background: #fff;
    }

    .row-inputs {
      display: flex;
      gap: 1rem;
    }

    .row-inputs .form-group {
      flex: 1;
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, #d604c8, #9b05a8);
      border: none;
      padding: 0.85rem;
      border-radius: 10px;
      width: 100%;
      font-weight: 700;
      color: white;
      transition: all 0.3s ease;
      margin-top: 1.2rem;
      box-shadow: 0 4px 15px rgba(214, 4, 200, 0.3);
    }

    .btn-primary-custom:hover {
      background: linear-gradient(135deg, #9b05a8, #d604c8);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(214, 4, 200, 0.45);
    }

    .btn-primary-custom:disabled {
      background: #cbd5e1;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .toggle-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .toggle-text a {
      color: #d604c8;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.3s;
    }

    .toggle-text a:hover {
      text-decoration: underline;
      color: #880588;
    }

    .message {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.75rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .error-message {
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
    }

    .success-message {
      color: #155724;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
    }

    /* Dynamic element toggling transitions */
    .role-dependent {
      display: none;
      animation: formFadeIn 0.35s ease forwards;
    }

    @keyframes formFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="register-container">
    <h2><i class="fas fa-user-plus"></i> Pendaftaran Akun</h2>
    <p class="subtitle-text">Silakan buat akun untuk mengakses sistem manajemen akademik Lab MPI</p>

    <!-- Segmented Tab Peran -->
    <div class="role-tabs">
      <button type="button" class="role-tab-btn active" id="tab-user" onclick="switchRole('user')">
        <i class="fas fa-graduation-cap"></i> Mahasiswa
      </button>
      <button type="button" class="role-tab-btn" id="tab-mentor" onclick="switchRole('mentor')">
        <i class="fas fa-chalkboard-teacher"></i> Mentor
      </button>
      <button type="button" class="role-tab-btn" id="tab-admin" onclick="switchRole('admin')">
        <i class="fas fa-user-shield"></i> Admin
      </button>
    </div>

    <form id="register-form">
      <!-- Username / Nama Lengkap (ALL ROLES) -->
      <div class="form-group">
        <label for="username" id="label-username"><i class="fas fa-user"></i> Nama Lengkap / Username</label>
        <input type="text" class="form-control" id="username" placeholder="Masukkan nama lengkap Anda" required />
      </div>

      <!-- NIM, Angkatan & Nomer HP (MAHASISWA ONLY) -->
      <div id="group-student" class="role-dependent" style="display: block;">
        <div class="row-inputs">
          <div class="form-group">
            <label for="nim"><i class="fas fa-id-card"></i> NIM</label>
            <input type="text" class="form-control" id="nim" placeholder="" />
          </div>
          <div class="form-group">
            <label for="angkatan"><i class="fas fa-calendar-alt"></i> Angkatan</label>
            <select class="form-control" id="angkatan">
              <option value="" disabled selected>Pilih Tahun</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
            </select>
          </div>
        </div>
        <div class="form-group mt-3">
          <label for="nomerHp"><i class="fas fa-phone-alt"></i> Nomor HP (WhatsApp)</label>
          <input type="tel" class="form-control" id="nomerHp" placeholder="" />
        </div>
      </div>

      <!-- Kode Rahasia Mentor (MENTOR ONLY) -->
      <div id="group-mentor" class="role-dependent">
        <div class="form-group">
          <label for="mentorSecret"><i class="fas fa-key"></i> Kode Rahasia Mentor</label>
          <input type="password" class="form-control" id="mentorSecret" placeholder="Masukkan kode rahasia mentor" />
        </div>
      </div>

      <!-- Kode Rahasia Admin (ADMIN ONLY) -->
      <div id="group-admin" class="role-dependent">
        <div class="form-group">
          <label for="adminSecret"><i class="fas fa-key"></i> Kode Rahasia Admin</label>
          <input type="password" class="form-control" id="adminSecret" placeholder="Masukkan kode rahasia admin" />
        </div>
      </div>

      <!-- Password (ALL ROLES) -->
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" class="form-control" id="password" placeholder="Buat password yang kuat" required />
      </div>

      <button type="submit" class="btn-primary-custom" id="submit-btn">
        <i class="fas fa-paper-plane"></i> Daftar Sekarang
      </button>
    </form>

    <div id="message-container"></div>

    <div class="toggle-text">
      <span>Sudah punya akun?</span>
      <a href="login.html">Login di sini</a>
    </div>
  </div>

  <script>
    let activeRole = 'user';

    // SWITCH TAB PERAN
    function switchRole(role) {
      activeRole = role;

      // Update button active states
      document.querySelectorAll(".role-tab-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById(`tab-${role}`).classList.add("active");

      // Hide all dynamic groups
      document.querySelectorAll(".role-dependent").forEach(group => group.style.display = "none");

      // Reset required fields
      document.getElementById("nim").required = false;
      document.getElementById("angkatan").required = false;
      document.getElementById("nomerHp").required = false;
      document.getElementById("mentorSecret").required = false;
      document.getElementById("adminSecret").required = false;

      // Reset nomerHp value if not user (optional)
      if (role !== 'user') {
        document.getElementById("nomerHp").value = "";
      }

      // Show targeted group & enable requirements
      if (role === 'user') {
        document.getElementById("group-student").style.display = "block";
        document.getElementById("nim").required = true;
        document.getElementById("angkatan").required = true;
        document.getElementById("nomerHp").required = true;
        document.getElementById("label-username").innerHTML = `<i class="fas fa-user"></i> Nama Lengkap / Username`;
      } else if (role === 'mentor') {
        document.getElementById("group-mentor").style.display = "block";
        document.getElementById("mentorSecret").required = true;
        document.getElementById("label-username").innerHTML = `<i class="fas fa-user-tie"></i> Nama Lengkap Mentor`;
      } else if (role === 'admin') {
        document.getElementById("group-admin").style.display = "block";
        document.getElementById("adminSecret").required = true;
        document.getElementById("label-username").innerHTML = `<i class="fas fa-user-shield"></i> Username Admin`;
      }

      // Clear messages when switching roles
      const msgContainer = document.getElementById("message-container");
      msgContainer.className = "";
      msgContainer.textContent = "";
    }

    // SUBMISSION FORM HANDLING
    async function handleRegister(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Fields according to active role
      let nim = null;
      let angkatan = null;
      let nomerHp = null;
      let kelas = null; // assigned later by admin or mentor panel
      let mentorSecret = null;
      let adminSecret = null;

      if (activeRole === 'user') {
        nim = document.getElementById("nim").value;
        angkatan = document.getElementById("angkatan").value;
        nomerHp = document.getElementById("nomerHp").value;
      } else if (activeRole === 'mentor') {
        mentorSecret = document.getElementById("mentorSecret").value;
      } else if (activeRole === 'admin') {
        adminSecret = document.getElementById("adminSecret").value;
      }

      const msgContainer = document.getElementById("message-container");
      const submitBtn = document.getElementById("submit-btn");

      submitBtn.disabled = true;
      msgContainer.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sedang memproses pendaftaran...`;
      msgContainer.className = "message";

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            username,
            password,
            nim,
            angkatan,
            kelas,
            nomerHp,
            adminSecret,
            mentorSecret,
            role: activeRole
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          msgContainer.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.error || "Terjadi kesalahan"}`;
          msgContainer.className = "message error-message";
          submitBtn.disabled = false;
        } else {
          msgContainer.innerHTML = '<i class="fas fa-check-circle"></i> Registrasi berhasil! Mengalihkan ke login...';
          msgContainer.className = "message success-message";

          document.getElementById("register-form").reset();

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1800);
        }
      } catch (error) {
        console.error("Register error:", error);
        msgContainer.innerHTML = '<i class="fas fa-wifi"></i> Gagal terhubung ke server.';
        msgContainer.className = "message error-message";
        submitBtn.disabled = false;
      }
    }

    document.getElementById("register-form").addEventListener("submit", handleRegister);

    // Set initial active state correctly
    switchRole('user');
  </script>
</body>

</html>
