<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Islamic Education Management</title>
  <link rel="shortcut icon" href="/img/1.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // AUTO-REDIRECT IF ALREADY LOGGED IN
    if (localStorage.getItem("loggedIn")) {
      const role = localStorage.getItem("userRole");
      if (role === "admin") {
        window.location.replace("admin.html");
      } else if (role === "mentor") {
        window.location.replace("mentor.html");
      } else {
        window.location.replace("index.html");
      }
    }
  </script>
  <style>
    body {
      background-image: url("img/bg.jpg");
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #d604c8;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      font-weight: 500;
      color: #333;
    }

    .form-control {
      border: 2px solid #d604c8;
      border-radius: 8px;
      padding: 0.75rem;
    }

    .form-control:focus {
      border-color: #880588;
      box-shadow: 0 0 0 0.2rem rgba(214, 4, 200, 0.25);
    }

    .btn-primary-custom {
      background: #d604c8;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      width: 100%;
      font-weight: 600;
      color: white;
      transition: background 0.3s;
      margin-top: 0.5rem;
    }

    .btn-primary-custom:hover {
      background: #880588;
    }

    .toggle-text {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .toggle-text a {
      color: #d604c8;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    .message {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .error-message {
      color: red;
    }

    .success-message {
      color: green;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2 id="form-title"><i class="fas fa-graduation-cap"></i> Login</h2>
    <form id="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <div class="form-check mb-3" id="remember-me-container">
        <input class="form-check-input" type="checkbox" id="rememberMe">
        <label class="form-check-label" for="rememberMe" style="font-size: 0.9rem; color: #555; font-weight: 500;">
          Ingat Saya
        </label>
      </div>
      <button type="submit" class="btn-primary-custom" id="submit-btn">
        Login
      </button>
    </form>
    <div id="message-container" class="message"></div>
    <div class="toggle-text">
      <span>Belum punya akun?</span>
      <a href="register.html">Daftar di sini</a>
    </div>
  </div>

  <script>
    async function handleAuth(event) {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const msgContainer = document.getElementById("message-container");

      msgContainer.textContent = "Loading...";
      msgContainer.className = "message";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          msgContainer.textContent = data.error || "Terjadi kesalahan";
          msgContainer.className = "message error-message";
        } else {
          msgContainer.textContent = "Login berhasil";
          msgContainer.className = "message success-message";
          localStorage.setItem("loggedIn", "true");
          localStorage.setItem("username", username);
          localStorage.setItem("userKelas", data.user.kelas || "");
          localStorage.setItem("userRole", data.user.role || "user");

          const rememberMe = document.getElementById("rememberMe").checked;
          if (rememberMe) {
            localStorage.setItem("rememberedUsername", username);
          } else {
            localStorage.removeItem("rememberedUsername");
          }

          setTimeout(() => {
            if (data.user.role === "admin") {
              window.location.href = "admin.html";
            } else if (data.user.role === "mentor") {
              window.location.href = "mentor.html";
            } else {
              window.location.href = "index.html";
            }
          }, 1000);
        }
      } catch (error) {
        console.error("Auth error:", error);
        msgContainer.textContent = "Gagal terhubung ke server. Pastikan server backend berjalan.";
        msgContainer.className = "message error-message";
      }
    }

    document.getElementById("auth-form").addEventListener("submit", handleAuth);

    // Load remembered username if exists
    window.addEventListener("DOMContentLoaded", () => {
      const savedUsername = localStorage.getItem("rememberedUsername");
      if (savedUsername) {
        document.getElementById("username").value = savedUsername;
        document.getElementById("rememberMe").checked = true;
      }
    });
  </script>
</body>

</html>
